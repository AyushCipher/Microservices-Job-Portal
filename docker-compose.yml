services:
  redis:
    image: redis:7-alpine
    container_name: hireheaven-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: hireheaven-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: hireheaven-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  auth:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: auth
    container_name: hireheaven-auth
    env_file: ./services/auth/.env
    environment:
      Redis_url: redis://redis:6379
      Kafka_Broker: kafka:29092
    ports:
      - "5000:5000"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_started

  utils:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: utils
    container_name: hireheaven-utils
    env_file: ./services/utils/.env
    environment:
      Redis_url: redis://redis:6379
      Kafka_Broker: kafka:29092
    ports:
      - "5001:5001"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_started

  user:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: user
    container_name: hireheaven-user
    env_file: ./services/user/.env
    environment:
      Redis_url: redis://redis:6379
      UPLOAD_SERVICE: http://utils:5001
    ports:
      - "5002:5002"
    depends_on:
      redis:
        condition: service_healthy
      utils:
        condition: service_started

  job:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: job
    container_name: hireheaven-job
    env_file: ./services/job/.env
    environment:
      Redis_url: redis://redis:6379
      Kafka_Broker: kafka:29092
      UPLOAD_SERVICE: http://utils:5001
    ports:
      - "5003:5003"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      utils:
        condition: service_started

  payment:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: payment
    container_name: hireheaven-payment
    env_file: ./services/payment/.env
    environment:
      Redis_url: redis://redis:6379
    ports:
      - "5004:5004"
    depends_on:
      redis:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: gateway
    container_name: hireheaven-gateway
    environment:
      Redis_url: redis://redis:6379
      AUTH_SERVICE_URL: http://auth:5000
      UTILS_SERVICE_URL: http://utils:5001
      USER_SERVICE_URL: http://user:5002
      JOB_SERVICE_URL: http://job:5003
      PAYMENT_SERVICE_URL: http://payment:5004
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      auth:
        condition: service_started
      user:
        condition: service_started
      job:
        condition: service_started
      payment:
        condition: service_started
      utils:
        condition: service_started

  frontend:
    build: ./frontend
    container_name: hireheaven-frontend
    env_file: ./frontend/.env
    ports:
      - "3000:3000"
    depends_on:
      - gateway

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: hireheaven-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    ports:
      - "9090:9090"
    depends_on:
      - gateway
      - auth
      - utils
      - user
      - job
      - payment

  grafana:
    image: grafana/grafana:10.4.0
    container_name: hireheaven-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  redis-data:
  prometheus-data:
  grafana-data:

